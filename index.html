<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Jotter</title><meta name="theme-color" content="#2F5D8A"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jotter"></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar of filters plus a card grid on desktop; on a phone the sidebar becomes a filter sheet,
   collections move to a bottom tab bar, and the composer opens from a plus button. */
:root{
  --bg:#F3F4F1; --side:#ECEEE8; --surface:#FFFFFF; --surface2:#F7F8F5; --input:#FAFAF8;
  --ink:#16191D; --muted:#565D66; --line:#DDE0DA; --line2:#CFD3CB; --hover:#E6E8E2;
  --on:#16191D; --onink:#FFFFFF; --accent:#2F5D8A; --accent-ink:#2F5D8A; --icon:#4A515A; --box:#7B828B; --doneink:#6A717A;
  --th-bg:#E4ECF6; --th-ink:#1F4470; --td-bg:#FBEBD3; --td-ink:#6E3A05; --wi-bg:#EBE3F4; --wi-ink:#4F2E78;
  --bada-bg:#FBDDDD; --bada-ink:#8A1F2B; --chotta-bg:#DAF0E1; --chotta-ink:#1E5B3A;
  --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.12);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --side:#0C0F12; --surface:#1A1E24; --surface2:#15181D; --input:#14181C;
    --ink:#ECEEF0; --muted:#A0A8B2; --line:#2A2F36; --line2:#3E454E; --hover:#252A31;
    --on:#ECEEF0; --onink:#111418; --accent-ink:#97AEC4; --icon:#A8B0BA; --box:#8A929C; --doneink:#838B95;
    --th-bg:#1E3250; --th-ink:#BBD4F5; --td-bg:#4A3213; --td-ink:#F5D3A0; --wi-bg:#38274F; --wi-ink:#D9C6F2;
    --bada-bg:#4F1F26; --bada-ink:#F5B8BF; --chotta-bg:#1F4030; --chotta-ink:#B5E6C8;
    --shadow:rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --side:#0C0F12; --surface:#1A1E24; --surface2:#15181D; --input:#14181C;
  --ink:#ECEEF0; --muted:#A0A8B2; --line:#2A2F36; --line2:#3E454E; --hover:#252A31;
  --on:#ECEEF0; --onink:#111418; --accent-ink:#97AEC4; --icon:#A8B0BA; --box:#8A929C; --doneink:#838B95;
  --th-bg:#1E3250; --th-ink:#BBD4F5; --td-bg:#4A3213; --td-ink:#F5D3A0; --wi-bg:#38274F; --wi-ink:#D9C6F2;
  --bada-bg:#4F1F26; --bada-ink:#F5B8BF; --chotta-bg:#1F4030; --chotta-ink:#B5E6C8;
  --shadow:rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
::placeholder{color:var(--muted);opacity:1}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:flex;min-height:100vh}
.side{flex:0 0 280px;align-self:flex-start;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:28px 20px;display:flex;flex-direction:column;gap:26px;background:var(--side);border-right:1px solid var(--line);min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.side nav{display:flex;flex-direction:column;gap:4px}
.navlabel{padding:0 12px 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;text-align:left}
.navbtn:hover{background:var(--hover)}
.navbtn.on{background:var(--on);color:var(--onink)}
.navbtn .ct{font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
.sheet-head{display:none;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-family:var(--display);font-size:22px}
.mobile-only{display:none}

main{flex:1 1 0;min-width:0;padding:28px clamp(16px,4vw,48px) 56px;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.sub{margin-top:6px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.searchwrap{position:relative;display:block}
.searchwrap svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.field{height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--surface)}
input.field{width:240px;max-width:100%;padding:0 14px 0 40px}
select.field{padding:0 12px}
.sqbtn{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--surface);border-radius:12px;color:var(--ink)}
.sqbtn:hover{background:var(--hover)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--on);color:var(--onink);border-color:var(--on)}
textarea{width:100%;resize:vertical;min-height:72px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--input);line-height:1.45}
.crow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.crow label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.crow input{height:44px;width:180px;max-width:100%;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:var(--input);color:var(--ink)}
.cbtns{display:flex;gap:8px}
.primary{height:44px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.ghost{height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:transparent}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.filterline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.notice{padding:10px 14px;border-radius:12px;background:var(--td-bg);color:var(--td-ink);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px var(--shadow)}
.card.is-done{background:var(--surface2)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cplx[hidden]{display:none}
.sub .short{display:none}
.kindchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.k-thought{background:var(--th-bg);color:var(--th-ink)}
.k-todo{background:var(--td-bg);color:var(--td-ink)}
.k-wish{background:var(--wi-bg);color:var(--wi-ink)}
.k-bada{background:var(--bada-bg);color:var(--bada-ink)}
.k-chotta{background:var(--chotta-bg);color:var(--chotta-ink)}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.date{font-size:13px;color:var(--muted);margin-left:auto}
.ctop{justify-content:flex-start}
.cbody{display:flex;align-items:flex-start;gap:4px}
.check{flex:none;width:44px;height:44px;margin:-8px 0 -8px -10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--box);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.box svg{opacity:0}
.is-done .box{background:var(--accent);border-color:var(--accent-ink)}
.is-done .box svg{opacity:1}
.text{margin:0;flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.is-done .text{text-decoration:line-through;color:var(--doneink)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px -8px -8px 0}
.tag{font-size:14px;color:var(--muted)}
.acts{display:flex}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:10px;color:var(--icon)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn.pinned{color:var(--accent-ink)}
.empty{border:1.5px dashed var(--line2);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{font-family:var(--display);font-size:22px;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--on);color:var(--onink);max-width:calc(100% - 32px)}
.toast button{height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:inherit;font-weight:600;text-decoration:underline}

.tabs,.fab,.scrim{display:none}

@media (max-width:760px){
  .app{display:block}
  main{padding:20px 16px calc(150px + env(safe-area-inset-bottom,0px));gap:16px}
  h1{font-size:32px}
  .sub .long{display:none}
  .sub .short{display:inline}
  input.field{width:100%}
  .searchwrap{flex:1 1 100%;order:3}
  .tools{width:100%}
  .desk-only{display:none !important}
  .mobile-only{display:flex}
  .side,.composer{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:22px 22px 0 0;border:0;border-top:1px solid var(--line);background:var(--surface);max-height:85%;overflow-y:auto;min-height:0;
    padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .side{gap:18px;flex:none}
  .side .brand{display:none}
  .side nav{flex-direction:row;flex-wrap:wrap;gap:8px}
  .side .navlabel{flex:1 1 100%;padding:0}
  .side .navbtn{width:auto;border:1px solid var(--line2);border-radius:999px;gap:10px}
  .side .navbtn.on{border-color:var(--on)}
  .sheet-head{display:flex}
  body.sheet-filters .side,body.sheet-compose .composer{transform:none;visibility:visible;transition:transform .2s ease,visibility 0s}
  body.sheet-filters .scrim,body.sheet-compose .scrim{display:block;position:fixed;inset:0;z-index:20;border:0;padding:0;background:var(--scrim)}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--side);border-top:1px solid var(--line);padding:4px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
  .tab.on{color:var(--accent-ink)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10;width:56px;height:56px;border:0;border-radius:18px;background:var(--accent);color:#fff;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--shadow)}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  textarea{min-height:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* Sign-in screen */
.authwrap{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.authcard h2{margin:0;font-family:var(--display);font-size:26px;letter-spacing:-.01em}
.authcard .brand{padding:0}
.authcard label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.authcard input.field{width:100%;padding:0 14px}
.authcard .primary,.authcard .ghost{width:100%}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Filters">
    <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h4"/></svg></span>Jotter</div>
    <div class="sheet-head"><h2>Filters</h2><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Close filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <nav class="desk-only" aria-label="Collections"><div class="navlabel">Collections</div><div id="navViews" style="display:contents"></div></nav>
    <nav aria-label="Status"><div class="navlabel">Status</div><div id="navStatus" style="display:contents"></div></nav>
    <nav aria-label="Complexity"><div class="navlabel">Complexity</div><div id="navCplx" style="display:contents"></div></nav>
    <nav aria-label="Tags"><div class="navlabel">Tags</div><div id="navTags" style="display:contents"></div></nav>
    <div class="mobile-only" style="flex-direction:column;gap:8px">
      <label class="cap" for="sort2">Sort by</label>
      <select class="field sortsel" id="sort2"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">A to Z</option></select>
    </div>
    <div class="mobile-only" style="gap:10px">
      <button type="button" class="ghost" data-act="clear" style="flex:1">Clear all</button>
      <button type="button" class="primary" data-act="closeSheet" style="flex:1" id="showBtn">Show notes</button>
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1 id="heading">All notes</h1>
        <div class="sub"><span class="long" id="sub"></span><span class="short" id="subShort"></span></div>
      </div>
      <div class="tools">
        <label class="searchwrap"><span class="sr">Search notes</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input type="search" class="field" id="search" placeholder="Search notes" autocomplete="off">
        </label>
        <label class="desk-only"><span class="sr">Sort notes</span>
          <select class="field sortsel" id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">A to Z</option></select>
        </label>
        <button type="button" class="sqbtn" id="themeBtn" data-act="theme" aria-label="Switch to dark mode"></button>
        <button type="button" class="sqbtn" id="signoutBtn" data-act="signout" aria-label="Sign out" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg></button>
        <button type="button" class="sqbtn mobile-only" id="filterBtn" data-act="openFilters" aria-label="Filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="badge" id="badge" hidden></span></button>
      </div>
    </header>

    <div class="notice" id="notice" hidden>Cloud saving is not available here, so your notes are kept on this device only.</div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="sheet-head"><h2 id="composerTitle">New note</h2><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="kinds" role="group" aria-label="Note type" id="kinds"></div>
      <div class="kinds cplx" role="group" aria-label="Complexity" id="cplxPick" hidden></div>
      <label><span class="sr">Note text</span><textarea id="text" rows="2" placeholder="What is on your mind today?"></textarea></label>
      <div class="crow">
        <label>Tag <input type="text" id="tagIn" list="taglist" placeholder="optional" maxlength="24"></label>
        <datalist id="taglist"></datalist>
        <div class="cbtns"><button type="button" class="ghost" id="cancelEdit" data-act="cancelEdit" hidden>Cancel</button><button type="submit" class="primary" id="saveBtn">Add note</button></div>
      </div>
    </form>

    <div class="filterline" id="filterline" hidden><span id="filtertext"></span><button type="button" class="chip" data-act="clear">Clear filters</button></div>

    <section class="grid" id="list" aria-label="Notes" aria-live="polite"></section>
    <div id="emptyBox"></div>
  </main>
</div>

<nav class="tabs" id="tabs" aria-label="Collections"></nav>
<button type="button" class="fab" data-act="openCompose" aria-label="Add a note"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button type="button" class="scrim" data-act="closeSheet" aria-label="Close"></button>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastBtn" hidden>Undo</button></div>

<div class="authwrap" id="auth" hidden>
  <form class="authcard" id="authForm">
    <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h4"/></svg></span>Jotter</div>
    <h2 id="authTitle">Sign in</h2>
    <label>Email<input type="email" class="field" id="authEmail" required autocomplete="email"></label>
    <label>Password<input type="password" class="field" id="authPass" required minlength="6" autocomplete="current-password"></label>
    <div class="notice" id="authMsg" role="status" hidden></div>
    <button type="submit" class="primary" id="authBtn">Sign in</button>
    <button type="button" class="ghost" id="authSwitch">Create an account</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

    else if (act === 'theme') {
      var next = effTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('jotter-theme', next); } catch (e) {}
      render();
    }
    else if (act === 'signout') { if (signOutFn) signOutFn(); }
    else if (act === 'openFilters') { closeSheet(); document.body.classList.add('sheet-filters'); }
    else if (act === 'openCompose') { closeSheet(); document.body.classList.add('sheet-compose'); setTimeout(function () { $('#text').focus(); }, 50); }
    else if (act === 'closeSheet') { closeSheet(); }
  });

  $('#toastBtn').addEventListener('click', function () {
    var d = S.lastDeleted; if (!d) return;
    $('#toast').hidden = true; S.lastDeleted = null;
    store.put(d.id, d.data).catch(fail);
  });

  $('#search').addEventListener('input', function (e) { S.query = e.target.value; render(); });
  document.addEventListener('change', function (e) {
    if (e.target.classList && e.target.classList.contains('sortsel')) { S.sort = e.target.value; render(); }
  });

  function submit() {
    var text = $('#text').value.trim();
    if (!text) { $('#text').focus(); return; }
    var tag = $('#tagIn').value.trim().replace(/^#/, '');
    var p;
    if (S.editingId) p = store.patch(S.editingId, { kind: S.kind, text: text, tag: tag, complexity: S.kind === 'todo' ? S.cplx : '', updatedAt: Date.now() });
    else p = store.add({ kind: S.kind, text: text, tag: tag, complexity: S.kind === 'todo' ? S.cplx : '', done: false, pinned: false, createdAt: Date.now() });
    resetComposer(); render(); closeSheet();
    p.catch(fail);
  }
  $('#composer').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  $('#text').addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submit(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  render();
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
